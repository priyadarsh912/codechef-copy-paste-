<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CodeChef Clipboard Helper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 480px;
      padding: 16px;
      background: #18191a;
      color: #e4e6eb;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f7a833;
    }
    .version {
      font-size: 11px;
      background: #2d3748;
      color: #94a3b8;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #242526;
      border: 1px solid #3a3b3c;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 10px;
    }
    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      margin-right: 5px;
    }
    .pill-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .pill {
      font-size: 11px;
      background: #2c2f33;
      border: 1px solid #4a4d52;
      color: #e2e8f0;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill:hover {
      background: #3b3e44;
      border-color: #f7a833;
    }
    .pill.active {
      background: #f7a833;
      color: #121212;
      font-weight: 600;
      border-color: #f7a833;
    }
    textarea {
      width: 100%;
      height: 230px;
      background: #0d1117;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11.5px;
      resize: vertical;
      line-height: 1.45;
      margin-bottom: 10px;
      white-space: pre;
    }
    textarea:focus {
      outline: none;
      border-color: #f7a833;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    button {
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      flex: 2;
      background: #f7a833;
      color: #121212;
    }
    .btn-primary:hover {
      background: #ffa726;
    }
    .btn-secondary {
      flex: 1;
      background: #3a3b3c;
      color: #e4e6eb;
    }
    .btn-secondary:hover {
      background: #4e4f50;
    }
    #msg {
      font-size: 11.5px;
      text-align: center;
      min-height: 18px;
      margin-top: 4px;
    }
    .success {
      color: #4ade80;
    }
    .error {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>⚡ CodeChef Clipboard Helper</h2>
    <span class="version">v1.0.3</span>
  </div>

  <div class="status-bar">
    <div><span class="status-dot"></span><span>100% CSP Compliant & Formatted</span></div>
    <span id="tabStatus" style="color: #94a3b8;">Checking Tab...</span>
  </div>

  <div class="pill-row">
    <button type="button" class="pill active" id="btnClassMain">Class: Main</button>
    <button type="button" class="pill" id="btnClassSQLite">Class: SQLiteJDBCExample</button>
  </div>

  <textarea id="codeArea" placeholder="Enter code to inject into active editor..." spellcheck="false"></textarea>

  <div class="btn-row">
    <button id="injectBtn" class="btn-primary">⚡ Clean & Inject to Editor</button>
    <button id="formatBtn" class="btn-secondary">🧹 Format</button>
    <button id="copyBtn" class="btn-secondary">📋 Copy</button>
  </div>

  <div id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
